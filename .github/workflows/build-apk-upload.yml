name: Build APK and Commit Artifact

on:
  workflow_dispatch:
  push:
    branches: [ MASTER ]
    paths:
      - 'LabelStoreMax/**'
      - '.github/workflows/build-apk-upload.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        run: |
          cd LabelStoreMax
          flutter pub get

      - name: Build Debug APK
        run: |
          cd LabelStoreMax
          flutter build apk --debug

      - name: Commit APK artifact
        if: ${{ !contains(github.event.head_commit.message, '[artifact]') }}
        run: |
          mkdir -p build-artifacts/android
          cp LabelStoreMax/build/app/outputs/flutter-apk/app-debug.apk build-artifacts/android/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-artifacts/android/app-debug.apk
          git commit -m "chore: add debug APK artifact [artifact]" || echo "No changes to commit"
          git push origin HEAD:MASTER
