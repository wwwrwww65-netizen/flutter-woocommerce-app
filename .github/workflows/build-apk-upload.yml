name: Build APK (Artifact Only)

on:
  workflow_dispatch:
  push:
    branches: [ MASTER ]
    paths:
      - 'LabelStoreMax/**'
      - '.github/workflows/build-apk-upload.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        run: |
          cd LabelStoreMax
          flutter pub get

      - name: Build Debug APK
        run: |
          cd LabelStoreMax
          flutter build apk --debug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: LabelStoreMax/build/app/outputs/flutter-apk/app-debug.apk

      # No commit to repo; APK is available only as a CI artifact
