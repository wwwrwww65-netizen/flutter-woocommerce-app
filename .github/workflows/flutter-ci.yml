name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
      - name: Install dependencies
        run: |
          cd LabelStoreMax
          flutter pub get
      - name: Analyze
        run: |
          cd LabelStoreMax
          flutter analyze
      - name: Test
        run: |
          cd LabelStoreMax
          flutter test --no-pub
      - name: Build APK (debug)
        run: |
          cd LabelStoreMax
          flutter build apk --debug
