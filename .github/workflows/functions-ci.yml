name: Functions CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          cd mobile-troubleshooter-backend/functions
          npm ci
      - name: Lint
        run: |
          cd mobile-troubleshooter-backend/functions
          npm run lint --silent || true
      - name: Build
        run: |
          cd mobile-troubleshooter-backend/functions
          npm run build
