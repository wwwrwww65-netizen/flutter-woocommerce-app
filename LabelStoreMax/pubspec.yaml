# Official WooSignal App Template for WooCommerce

# Label StoreMax
# Version: 8.2.3
# Author: Anthony Gordon
# Homepage: https://woosignal.com
# Documentation: https://woosignal.com/docs/app/label-storemax

### Change App Icon
# 1 Replace: public/icon/appicon.png (1024px1024px icon size)
# 2 Run this command from the terminal: "dart run flutter_launcher_icons:main"

### Uploading the IOS/Android app
# IOS https://flutter.dev/docs/deployment/ios
# Android https://flutter.dev/docs/deployment/android

name: flutter_app
description: Label StoreMax

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0 <4.0.0"

dependencies:
  google_fonts: ^6.2.1
  analyzer: ^7.7.0
  intl: ^0.20.2
  nylo_framework: ^6.8.13
  woosignal: ^4.2.0
  wp_json_api: ^4.3.4
  cached_network_image: ^3.4.1
  package_info_plus: ^8.3.0
  flutter_inappwebview: ^6.1.5
  pull_to_refresh_flutter3: 2.0.2
  url_launcher: ^6.3.2
  bubble_tab_indicator: ^0.1.6
  math_expressions: ^3.0.0
  validated: ^2.0.0
  flutter_spinkit: ^5.2.1
  auto_size_text: ^3.0.0
  html: ^0.15.6
  flutter_widget_from_html_core: ^0.17.0
  flutter_rating_bar: ^4.0.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_swiper_view: ^1.1.8
  firebase_messaging: ^15.2.9
  firebase_core: ^3.15.1
  collection: ^1.19.1
  flutter_stripe: ^11.5.0
  razorpay_flutter: ^1.4.0
  pretty_dio_logger: ^1.4.0
  animate_do: ^4.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Firebase core + services
  cloud_functions: ^5.1.4
  firebase_auth: ^5.3.4
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.4
  firebase_remote_config: ^5.1.4
  firebase_storage: ^13.3.4
  # Auth
  google_sign_in: ^6.2.2
  # Local DB and search
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  # Media picking
  image_picker: ^1.1.2
  # IAP
  in_app_purchase: ^3.1.14
  # Ads
  google_mobile_ads: ^5.1.0
  facebook_audience_network: ^1.0.1
  app_tracking_transparency: ^2.0.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# APP ICON
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "public/app_icon/appicon.png"
  remove_alpha_ios: true

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - public/fonts/
    - public/
    - public/json/
    - public/images/
    - lang/
    - .env
  # Splash/launcher configurations (if using native) can be added via flutter_native_splash
